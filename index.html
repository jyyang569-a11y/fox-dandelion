<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F4EE">
<title>狐狸的蒲公英</title>
<style>
:root{
  --cream:#F7F4EE; --paper:#FFFDF8;
  --sage:#A7D8A0; --sage-deep:#6F9A66; --sage-ink:#587249;
  --orange:#F4A340; --orange-deep:#B66B25;
  --yellow:#FFE9A8; --blue:#8FB7E3; --blue-deep:#5C7FA4;
  --brown:#5E544F; --muted:#9A8F84; --line:#E8E0D4;
  --shadow:0 10px 28px rgba(94,84,79,.09);
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;background:#E7E2D8;color:var(--brown);-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
textarea,input{font:inherit}
.hand{font-family:"LXGW WenKai","STKaiti","KaiTi","PingFang SC",serif}
.app{position:relative;width:min(100%,430px);height:100dvh;margin:0 auto;background:var(--cream);overflow:hidden;box-shadow:0 0 44px rgba(94,84,79,.16)}
.screen{height:100%;overflow-y:auto;padding:env(safe-area-inset-top) 18px calc(98px + env(safe-area-inset-bottom));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}

/* ===== top bar ===== */
.top{display:flex;align-items:center;justify-content:space-between;padding:24px 2px 14px}
.top h1{font-size:24px;font-weight:800;letter-spacing:.4px}
.top h1.greet{font-family:"LXGW WenKai","STKaiti","KaiTi","PingFang SC",serif;font-size:27px;font-weight:800;letter-spacing:1px;color:#D9802E}
@supports (-webkit-background-clip:text) or (background-clip:text){
 .top h1.greet{background:linear-gradient(120deg,#E8954C 0%,#F4A340 55%,#E8954C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:1.5px;margin-bottom:3px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#FBE3B0,#F4C56C);display:grid;place-items:center;font-size:24px;box-shadow:0 6px 14px rgba(180,130,60,.28);flex:none}

/* ===== 首页插画（黄昏原野 · 小狐狸） ===== */
.hero{position:relative;height:308px;border-radius:30px;overflow:hidden;background:linear-gradient(180deg,#8FB7E3 0%,#AFC8E2 30%,#F0D9B6 58%,#AAC98F 78%,#7E9C6D 100%);box-shadow:var(--shadow)}
.hero.sky-morning{background:linear-gradient(180deg,#9FC4E8 0%,#C2D9EA 34%,#F6E5C9 58%,#AAC98F 78%,#7E9C6D 100%)}
.hero.sky-day{background:linear-gradient(180deg,#5FA3DE 0%,#9CC4EA 36%,#D7E9EC 60%,#AAC98F 78%,#7E9C6D 100%)}
.hero.sky-evening{background:linear-gradient(180deg,#E88D7A 0%,#F2B692 34%,#F8E2BE 58%,#A9C48E 78%,#7E9C6D 100%)}
.hero.sky-night{background:linear-gradient(180deg,#26395F 0%,#3E517C 34%,#5A5C85 58%,#43594B 78%,#2F4437 100%)}
.hero.sky-night .hill.h1{background:linear-gradient(#4E6648,#3C5238)}
.hero.sky-night .hill.h2{background:linear-gradient(#455C40,#354A32)}
.hero.sky-night .meadow{background:linear-gradient(#3B5240,#2C4030)}
.hero.sky-night .grass{color:#24341F}
.hero.sky-night .cloud{opacity:.16}
.hero:before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 18% 24%,rgba(255,255,255,.85) 0 2px,transparent 3px),
 radial-gradient(circle at 72% 16%,rgba(255,255,255,.65) 0 1.5px,transparent 2.5px),
 radial-gradient(circle at 88% 34%,rgba(255,255,255,.6) 0 1.5px,transparent 2.5px),
 radial-gradient(circle at 42% 10%,rgba(255,255,255,.5) 0 1px,transparent 2px),
 radial-gradient(circle at 58% 26%,rgba(255,255,255,.45) 0 1px,transparent 2px)}
.sun{position:absolute;right:30px;top:26px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 36% 36%,#FFF6D8,#FFE1A6);box-shadow:0 0 32px rgba(255,225,166,.95)}
.cloud{position:absolute;height:22px;border-radius:20px;background:rgba(255,255,255,.82);filter:drop-shadow(0 3px 6px rgba(120,140,170,.12))}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:30px;height:30px;left:16px;top:-12px}
.cloud:after{width:22px;height:22px;left:42px;top:-6px}
.c1{left:6%;top:18%;width:92px;animation:cloudDrift 16s ease-in-out infinite}
.c2{left:56%;top:10%;width:62px;opacity:.72;animation:cloudDrift 21s ease-in-out infinite reverse}
.c3{left:34%;top:30%;width:48px;opacity:.5;animation:cloudDrift 25s ease-in-out infinite}
@keyframes cloudDrift{50%{transform:translateX(26px)}}
.hill{position:absolute;border-radius:50% 50% 0 0}
.hill.h1{left:-20%;bottom:66px;width:132%;height:122px;background:linear-gradient(#A9C48E,#8FAD7C)}
.hill.h2{right:-26%;bottom:58px;width:132%;height:142px;background:linear-gradient(#9BB987,#7E9C6D);opacity:.95}
.meadow{position:absolute;left:-12%;bottom:-52px;width:124%;height:142px;background:linear-gradient(#86A474,#6E8C5E);border-radius:50% 50% 0 0}
.grass{position:absolute;bottom:44px;color:#5F7E50;font-size:17px;z-index:2;text-shadow:0 1px 2px rgba(255,255,255,.35)}
.g1{left:9%}.g2{left:21%;font-size:13px}.g3{right:11%;font-size:16px}.g4{right:25%;font-size:13px}.g5{left:47%;font-size:14px}
.fox{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font-size:92px;z-index:3;filter:drop-shadow(0 10px 8px rgba(0,0,0,.18));animation:foxBob 3.6s ease-in-out infinite}
@keyframes foxBob{50%{transform:translateX(-50%) translateY(-6px)}}
.dandelion{position:absolute;color:#FFF9E7;text-shadow:0 1px 4px rgba(94,84,79,.22);animation:float 5s ease-in-out infinite;z-index:2}
.d1{left:10%;top:34%;font-size:27px}.d2{right:14%;top:44%;font-size:21px;animation-delay:1.1s}.d3{left:64%;top:18%;font-size:19px;animation-delay:2s}.d4{left:32%;top:12%;font-size:17px;animation-delay:.6s}.d5{left:80%;top:54%;font-size:23px;animation-delay:3s}.d6{left:46%;top:50%;font-size:15px;animation-delay:2.5s}
@keyframes float{50%{transform:translateY(-11px) rotate(6deg)}}
.heroText{position:absolute;left:20px;top:16px;color:#fff;z-index:4;text-shadow:0 1px 5px rgba(70,90,120,.35)}
.heroText b{font-size:18px;display:block}
.heroText p{margin:5px 0 0;font-size:12px;opacity:.95;letter-spacing:.5px}
.growth{position:absolute;right:14px;bottom:14px;background:rgba(255,253,248,.94);border-radius:18px;padding:9px 14px;text-align:center;box-shadow:0 6px 16px rgba(94,84,79,.14);z-index:4}
.growth b{font-size:24px;display:block;color:var(--orange-deep)}
.growth span{font-size:11px;color:var(--muted)}

/* ===== 卡片 & 通用 ===== */
.card{background:var(--paper);border:1px solid rgba(232,224,212,.85);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:12px 0}
.card.soft{background:linear-gradient(135deg,#FFF8E3,#F1F6EC);border-color:rgba(232,224,212,.5)}
h2{font-size:19px;font-weight:800;margin:22px 0 10px;letter-spacing:.3px}
h3{font-size:15px;font-weight:700;margin:0 0 6px}
.sub{color:var(--muted);font-size:12px;line-height:1.8}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.sectionTitle h2{margin:0}
.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.task:last-child{border-bottom:0}
.check{width:26px;height:26px;border:1.6px solid #CDBFAB;border-radius:50%;display:grid;place-items:center;flex:none;transition:.25s;background:#fff}
.task.done .check{background:var(--sage);border-color:var(--sage);color:#fff}
.task.done .taskText b{color:var(--muted);text-decoration:line-through}
.taskText{flex:1;min-width:0}
.taskText b{font-size:15px;display:block}
.progress{font-size:11px;color:var(--muted);flex:none}
.listCard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}
.listCard .d{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.listCard p{font-size:13.5px;line-height:1.85;margin-top:7px}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;background:#EDF3E9;color:var(--sage-ink);font-size:11px;margin-top:9px;font-weight:600}
.tag.orange{background:#FFF0DD;color:var(--orange-deep)}
.tag.blue{background:#EAF1F8;color:var(--blue-deep)}
.tag.purple{background:#F1EAF7;color:#8A6DB0}
.row{display:flex;gap:9px;margin:12px 0;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:18px;background:#EEE8DE;font-size:12.5px;font-weight:600;color:var(--muted);transition:.2s}
.chip.selected{background:#DFEAD9;color:var(--sage-ink)}
.empty{text-align:center;padding:38px 12px;color:var(--muted)}
.empty b{font-size:46px;display:block;margin-bottom:10px}
.emptyNote{color:var(--muted);font-size:13px;text-align:center;padding:22px 10px;line-height:1.8}

/* ===== 底部导航 ===== */
.nav{position:absolute;left:12px;right:12px;bottom:12px;height:68px;background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:26px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 14px 38px rgba(60,50,40,.14);z-index:20;backdrop-filter:blur(8px)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#91887E;transition:.2s;position:relative}
.nav button span{font-size:21px;transition:.2s}
.nav button.active{color:var(--sage-ink);font-weight:700}
.nav button.active span{transform:translateY(-2px) scale(1.08)}
.nav button.active:before{content:"";position:absolute;top:4px;width:22px;height:4px;border-radius:4px;background:var(--sage);opacity:.9}

/* ===== 蒲公英原野 ===== */
.field{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;justify-content:center;padding:16px 6px 6px}
.field span{display:inline-block;animation:sway 4s ease-in-out infinite;transform-origin:bottom center}
@keyframes sway{50%{transform:rotate(7deg) translateY(-3px)}}

/* ===== 我的森林（插画） ===== */
.forest{height:290px;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(180deg,#8FAECB 0%,#B7CCD8 28%,#DFE9D6 44%,#AFC89B 45%,#86A474 100%);border:1px solid var(--line)}
.forest.sky-morning{background:linear-gradient(180deg,#9FC4E8 0%,#C2D9EA 26%,#DFE9D6 44%,#AFC89B 45%,#86A474 100%)}
.forest.sky-day{background:linear-gradient(180deg,#5FA3DE 0%,#9CC4EA 26%,#DFE9D6 44%,#AFC89B 45%,#86A474 100%)}
.forest.sky-evening{background:linear-gradient(180deg,#E88D7A 0%,#F2B692 26%,#DFE9D6 44%,#AFC89B 45%,#86A474 100%)}
.forest.sky-night{background:linear-gradient(180deg,#26395F 0%,#3E517C 26%,#55604F 44%,#475D48 45%,#334A38 100%)}
.forest.sky-night .fhill.f1{background:linear-gradient(#4E6648,#3C5238)}
.forest.sky-night .fhill.f2{background:linear-gradient(#455C40,#354A32)}
.forest.sky-night .fcloud{opacity:.16}
.dpuff{position:absolute;z-index:2;transform-origin:bottom center;animation:puffSway 4s ease-in-out infinite}
.dpuff .ball{border-radius:50%;background:radial-gradient(circle at 35% 32%,#FFFFFF,#EDF2F4 58%,#CFD9DD);box-shadow:0 0 14px rgba(255,255,255,.75),0 3px 8px rgba(120,140,120,.18);margin:0 auto}
.dpuff .stem{width:2.5px;background:linear-gradient(#8FA98A,#5F7E50);margin:0 auto;border-radius:2px}
@keyframes puffSway{50%{transform:rotate(6deg)}}
.forest:before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 22% 16%,rgba(255,255,255,.8) 0 1.5px,transparent 2.5px),
 radial-gradient(circle at 70% 22%,rgba(255,255,255,.6) 0 1.5px,transparent 2.5px)}
.fhill{position:absolute;border-radius:50% 50% 0 0}
.fhill.f1{left:-18%;bottom:72px;width:132%;height:112px;background:linear-gradient(#AFC89B,#93B281)}
.fhill.f2{right:-22%;bottom:62px;width:132%;height:132px;background:linear-gradient(#9FC08C,#7E9C6D);opacity:.95}
.forest .fcloud{position:absolute;height:18px;border-radius:16px;background:rgba(255,255,255,.75)}
.forest .fcloud:before,.forest .fcloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.forest .fcloud:before{width:24px;height:24px;left:13px;top:-10px}
.forest .fcloud:after{width:18px;height:18px;left:34px;top:-5px}
.forest .fc1{left:8%;top:14%;width:70px;animation:cloudDrift 18s ease-in-out infinite}
.forest .fc2{left:55%;top:9%;width:50px;opacity:.7;animation:cloudDrift 23s ease-in-out infinite reverse}
.forest .tree{position:absolute;bottom:22px;font-size:82px;z-index:2;filter:drop-shadow(0 6px 5px rgba(0,0,0,.12))}
.forest .t1{left:9%}.forest .t2{right:10%;font-size:98px}.forest .t3{left:37%;bottom:27px;font-size:66px}
.forest .fox{position:absolute;z-index:3;bottom:26px;left:50%;transform:translateX(-50%);font-size:48px;animation:forestBob 3.8s ease-in-out infinite}
@keyframes forestBob{50%{transform:translateX(-50%) translateY(-6px)}}
.forest .fd{position:absolute;color:#FFFDF6;font-size:18px;text-shadow:0 1px 3px rgba(94,84,79,.22);animation:float 5s ease-in-out infinite;z-index:2}
.forest .fd1{left:20%;top:42%}.forest .fd2{right:18%;top:36%;font-size:15px;animation-delay:1.1s}.forest .fd3{left:55%;top:22%;font-size:14px;animation-delay:2s}.forest .fd4{left:34%;top:58%;font-size:16px;animation-delay:1.7s}

/* ===== 蒲公英之间的风 ===== */
.wind{position:relative;padding:4px 6px 4px 22px;max-height:300px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#cfc6b8 transparent}.wind::-webkit-scrollbar{width:6px}.wind::-webkit-scrollbar-thumb{background:#d8cfc1;border-radius:6px}
.wind:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;border-left:2px dashed var(--sage)}
.wind .node{position:relative;padding:0 0 16px}
.wind .node:before{content:"🌼";position:absolute;left:-23px;top:0;font-size:14px}
.wind .node small{color:var(--muted);font-size:11px}
.wind .node p{font-size:13px;line-height:1.75;margin-top:4px;color:var(--brown)}
.windEnd{margin-top:4px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#FFF8E3,#F0F5E9);font-size:13.5px;line-height:1.9;font-weight:600}
.comments{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.cmt{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.cmt>span{font-size:14px;flex:none;margin-top:1px;opacity:.85}
.cmt b{font-size:11px;display:inline;color:var(--muted);font-weight:600}
.cmt small{color:var(--muted);font-size:9.5px;margin-left:4px}
.cmt p{font-size:11.5px;line-height:1.65;margin-top:1px;color:var(--muted)}
.cmtAdd{display:flex;gap:6px;align-items:center;margin-top:4px}
.cmtAdd>span{font-size:14px;flex:none;opacity:.85}
.cmtAdd input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;font-size:11.5px;background:#FBF9F4;outline:none;min-width:0;color:var(--muted)}
.cmtAdd input:focus{border-color:var(--sage)}
.cmtAdd input::placeholder{color:#BDB4A8}
.cmtAdd button{background:var(--sage-deep);color:#fff;border-radius:12px;padding:6px 12px;font-size:11px;font-weight:600;flex:none;opacity:.9}

/* ===== 关于我们 ===== */
.about{position:absolute;inset:0;z-index:35;background:linear-gradient(165deg,#FFF9EC 0%,#F7F3E6 45%,#EFF5E9 100%);display:none;align-items:center;justify-content:center;padding:36px 30px;text-align:center}
.about.show{display:flex}
.aboutClose{position:absolute;top:24px;right:26px;font-size:28px;color:var(--muted);line-height:1}
.aboutIco{font-size:54px;margin-bottom:20px;animation:forestBob 3.6s ease-in-out infinite}
.aboutNames{font-family:"LXGW WenKai","STKaiti","KaiTi",serif;font-size:30px;font-weight:700;letter-spacing:4px;color:var(--brown)}
.aboutLove{font-family:"LXGW WenKai","STKaiti","KaiTi",serif;font-size:46px;font-weight:800;margin:18px 0 4px;background:linear-gradient(120deg,#E8954C,#F4A340);-webkit-background-clip:text;background-clip:text;color:transparent}
.aboutDiv{color:var(--sage-deep);letter-spacing:10px;margin:14px 0;font-size:16px}
.aboutBless{font-family:"LXGW WenKai","STKaiti","KaiTi",serif;font-size:24px;letter-spacing:4px;color:var(--sage-ink);font-weight:600;line-height:2}
.aboutSign{color:var(--muted);font-size:15px;margin-top:20px;letter-spacing:3px}

/* ===== fab / modal / toast / 飞出的蒲公英 ===== */
.fab{position:fixed;right:max(24px,calc((100vw - 430px)/2 + 24px));bottom:96px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#9DC88F,#6F9A66);color:#fff;font-size:28px;box-shadow:0 12px 26px rgba(83,105,68,.32);z-index:15;display:grid;place-items:center;transition:transform .2s}
.fab:active{transform:scale(.92)}
.modal{position:absolute;inset:0;background:rgba(60,52,44,.38);z-index:30;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{width:100%;background:var(--cream);border-radius:30px 30px 0 0;padding:22px 18px 34px;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px}
.sheet textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:18px;padding:14px;background:#fffdf8;resize:none;outline:none;font-size:14.5px;line-height:1.8;margin-top:12px}
.sheet textarea:focus{border-color:var(--sage)}
.weather{display:flex;gap:8px;flex-wrap:wrap}
.wchip{width:52px;height:58px;border-radius:16px;background:#FFFDF8;border:1.5px solid var(--line);display:grid;place-items:center;font-size:24px;transition:.2s}
.wchip.selected{background:#FFF6DF;border-color:var(--orange)}
.primary{width:100%;padding:15px;border-radius:18px;background:linear-gradient(135deg,#9DC88F,#6F9A66);color:#fff;font-weight:700;font-size:15px;margin-top:14px;box-shadow:0 8px 18px rgba(111,154,102,.3)}
.primary:active{transform:scale(.99)}
.toast{position:absolute;left:50%;bottom:98px;transform:translateX(-50%) translateY(16px);background:#4F5F49;color:#fff;padding:11px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.28s;z-index:40;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.flyD{position:absolute;font-size:26px;pointer-events:none;z-index:45;animation:flyUp 1.5s ease forwards}
@keyframes flyUp{
 0%{opacity:0;transform:translate(-50%,0) scale(.6) rotate(0)}
 25%{opacity:1}
 100%{opacity:0;transform:translate(30px,-160px) scale(1.15) rotate(24deg)}
}
.eggStar{position:absolute;z-index:50;pointer-events:none;opacity:0;animation:starFly 2.2s ease-out forwards}
@keyframes starFly{
 0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}
 15%{opacity:1}
 100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(120deg)}
}
.cloudBar{display:flex;justify-content:flex-end;margin:2px 2px 8px}
.cloudBtn{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12.5px;color:var(--sage-ink);font-weight:600;box-shadow:var(--shadow);transition:.2s}
.cloudBtn:active{transform:scale(.95)}
.cloudBtn span{font-size:16px;display:inline-block}
.cloudBtn.syncing span{animation:cloudPulse .8s ease-in-out infinite}
@keyframes cloudPulse{50%{transform:scale(1.25)}}

.hero .fox img{width:200px}
.forest .fox img{width:110px}

.calRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.totalCard,.calCard{border-radius:20px;padding:14px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:152px}
.totalCard{background:linear-gradient(155deg,#FFF6DC 0%,#FFFDF6 48%,#EFF6EA 100%);border:1px solid #F2E3BD;justify-content:center;align-items:center;text-align:center}
.totalCard:before{content:"";position:absolute;right:-14px;top:-14px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFE9A8,rgba(255,233,168,.15));opacity:.55}
.totalCard:after{content:"❀";position:absolute;left:-6px;bottom:-8px;font-size:30px;color:#A7D8A0;opacity:.4;transform:rotate(-18deg)}
.totalCard .t-ico{margin-bottom:4px}
.totalCard .t-label{font-size:11px;color:#B0874A;font-weight:700;letter-spacing:2px}

<script>
const LS="fox_dandelion_v4";
const now=()=>new Date();
const pad=n=>String(n).padStart(2,"0");
const fmtDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmtTime=d=>pad(d.getHours())+":"+pad(d.getMinutes());

const seed=()=>({
 tab:"home",
 lastActive:fmtDate(new Date()),
 tasks:[
  {id:"happy",icon:"😊",label:"小胡晔今天要开心",done:false},
  {id:"lucky",icon:"🍀",label:"小胡晔今天要幸运",done:false},
  {id:"fortune",icon:"🧧",label:"小胡晔今天福多多",done:false}
 ],
 notes:[]
});

let state;
function load(){
 try{const raw=localStorage.getItem(LS);if(raw){const s=JSON.parse(raw);const d=seed();const m=Object.assign(d,s);m.notes=m.notes.map(normalizeNote);return m}}catch(e){}
 return seed();
}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function initDay(){
 const today=fmtDate(new Date());
 if(state.lastActive!==today){state.tasks.forEach(t=>t.done=false);state.lastActive=today;save();}
}

function dandSVG(w){
 let rays="";
 for(let i=0;i<26;i++){
  const a=i/26*Math.PI*2;
  rays+=`<line x1="${(Math.cos(a)*3).toFixed(2)}" y1="${(Math.sin(a)*3).toFixed(2)}" x2="${(Math.cos(a)*13).toFixed(2)}" y2="${(Math.sin(a)*13).toFixed(2)}" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".95"/>`;
 }
 return `<svg viewBox="0 0 32 32" width="${w}" height="${w}" xmlns="http://www.w3.org/2000/svg" style="display:block;filter:drop-shadow(0 1px 2px rgba(94,84,79,.18))"><g transform="translate(16 16)">${rays}<circle r="5" fill="#fff" opacity=".95"/></g></svg>`;
}
function puffMarkup(){
 const puffs=[[12,18,44,0],[70,14,58,.9],[36,22,32,1.7],[55,16,40,2.4]];
 return puffs.map(p=>`<div class="dpuff" style="left:${p[0]}%;bottom:${p[1]}px;animation-delay:${p[3]}s">${dandSVG(p[2])}<div class="stem" style="height:${Math.round(16+p[2]/3)}px"></div></div>`).join("");
}
let calY=0,calM=0,calInit=false;
function calBase(){if(!calInit){const n=new Date();calY=n.getFullYear();calM=n.getMonth();calInit=true}return{y:calY,m:calM}}
function calMove(d){const b=calBase();let m=b.m+d,y=b.y;if(m<0){m=11;y--}if(m>11){m=0;y++}calY=y;calM=m;render()}
function calendarHTML(){
 const b=calBase(),y=b.y,m=b.m;
 const start=(new Date(y,m,1).getDay()+6)%7;
 const days=new Date(y,m+1,0).getDate();
 const today=fmtDate(new Date());
 let h=`<div class="calHead"><button onclick="calMove(-1)">‹</button><span>${y}年${m+1}月</span><button onclick="calMove(1)">›</button></div><div class="calGrid">`;
 ["一","二","三","四","五","六","日"].forEach(w=>h+=`<span class="w">${w}</span>`);
 for(let i=0;i<start;i++)h+=`<span class="d blank"></span>`;
 for(let d=1;d<=days;d++){
  const ds=y+"-"+pad(m+1)+"-"+pad(d);
  const has=state.notes.some(n=>n.date&&n.date.startsWith(ds));
  h+=`<span class="d ${has?"has":""} ${ds===today?"today":""}" ${has?`onclick="openDay('${ds}')"`:""}>${d}</span>`;
 }
 return h+`</div>`;
}
function openDay(ds){
 const list=state.notes.filter(n=>n.date&&n.date.startsWith(ds));
 if(!list.length){toast("这一天还没有留下话");return}
 document.getElementById("dayTitle").textContent=ds.replace(/-/g,".");
 document.getElementById("dayList").innerHTML=list.map(n=>noteCard(n)).join("");
 document.getElementById("dayModal").classList.add("show");
}
function closeDay(){document.getElementById("dayModal").classList.remove("show")}
function dateLine(){const d=new Date();return d.getFullYear()+" · "+pad(d.getMonth()+1)+" · "+pad(d.getDate())}
function hdr(title,sub,cls){return `<div class="top"><div><div class="eyebrow">${sub}</div><h1 class="${cls||""}">${title}</h1></div><div class="avatar">🦊</div></div>`}

function go(tab){state.tab=tab;save();render();document.getElementById("screen").scrollTop=0}
function render(){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));
 const views={home,dandelion,me};
 document.getElementById("screen").innerHTML=views[state.tab]();
 document.getElementById("fab").style.display=state.tab==="me"?"none":"grid";
}

/* ===== 首页 ===== */
function home(){
 const done=state.tasks.filter(t=>t.done).length;
 const allDone=done===state.tasks.length;
 const night=skyClass()==="sky-night";
 return `${hdr(greeting(),dateLine(),"greet")}
 <div class="hero ${skyClass()}">
  <div class="heroText"><b>今天也有蒲公英等着你。</b><p>把一点点福气，留在风里。</p></div>
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="dandelion d1">${dandSVG(26)}</div><div class="dandelion d2">${dandSVG(21)}</div><div class="dandelion d3">${dandSVG(19)}</div><div class="dandelion d4">${dandSVG(17)}</div><div class="dandelion d5">${dandSVG(23)}</div><div class="dandelion d6">${dandSVG(15)}</div>
  <div class="hill h1"></div><div class="hill h2"></div><div class="meadow"></div>
  <div class="grass g1">🌿</div><div class="grass g2">🌿</div><div class="grass g3">🌿</div><div class="grass g4">🌿</div><div class="grass g5">🌿</div>
  <div class="fox">${FOX_IMG}</div>
  <div class="growth"><b>${dandelionCount()}</b><span>蒲公英 · 朵</span></div>

function foxCard(){

 const h=new Date().getHours();

 else if(h>=23||h<5) msg="这么晚还在呀。今天也要开心、幸运、福多多。";
 else if(h<8) msg="清晨的风很安静。适合先记下第一个念头，再开始一天。";

function noteCard(n){

function addComment(noteId){
 const inp=document.getElementById("cmt-"+noteId);
 if(!inp)return;
 const text=inp.value.trim();
 if(!text){toast("先写一句吧");return}
 const note=state.notes.find(x=>x.id===noteId);
 if(!note)return;
 const cmt={a:identity,t:text,ts:Date.now()};
 note.comments=note.comments||[];note.comments.push(cmt);
 inp.value="";save();render();toast("评论发出去了");
 (async()=>{
  try{
   const latest=await cloudFetchOne(noteId);
   const base=latest&&latest.comments?latest.comments:[];
   const cm={};base.concat(note.comments).forEach(c=>cm[c.ts]=c);
   const merged=Object.values(cm).sort((a,b)=>a.ts-b.ts);
   note.comments=merged;save();
   await cloudPatch(noteId,{comments:merged});
  }catch(e){}
 })();
}
function delNote(id){
 const i=state.notes.findIndex(n=>n.id===id);
 if(i>-1){
  state.notes.splice(i,1);
  deletedIds.add(id);saveDeleted();
  save();render();
  toast("蒲公英飞走了，祝它去更远的地方。");
  cloudDelete(id).catch(()=>{});
 }
}
function fieldMarkup(total){
 const show=Math.min(total,42);
 let html="";
 for(let i=0;i<show;i++){
  const sz=15+((i*7)%11);
  const rot=((i*13)%16)-8;
  const delay=(i%7)*0.5;
  html+=`<span style="font-size:${sz}px;opacity:.95;animation-delay:${delay}s;transform:rotate(${rot}deg)">${i%4===0?"✽":i%4===1?"🌼":i%4===2?"❀":"✿"}</span>`;
 }
 if(total>show) html+=`<span style="font-size:13px;color:var(--muted);margin-left:6px">＋${total-show}</span>`;
 return html;
}
function setFilter(f){activeFilter=f;render()}

/* ===== 蒲公英之间的风 ===== */
function windMarkup(){
 const all=state.notes.slice().sort((a,b)=>a.ts-b.ts);
 const story=all.filter(n=>n.ts<Date.now()-1000*60*60*24*2).slice(-5);
 const list=story.length>=2?story:all.slice(-5);
 if(!list.length) return `<p class="sub" style="margin-top:8px">再多留下一些蒲公英，风会把它们串成一条路。</p>`;
 const first=list[0],last=list[list.length-1];
 const days=Math.max(1,Math.round((last.ts-first.ts)/86400000));
 const line=days>=120?"四个月前的你，大概不会想到今天的自己。":days>=60?"两个月前种下的念头，正在慢慢发芽。":days>=14?"两周前的你，正在一点点变成现在的你。":"每一次记录，都在悄悄改变着以后的自己。";
 return `<div class="wind">${list.map(n=>`<div class="node"><small>${n.date}</small><p>${n.text}</p></div>`).join("")}</div><div class="windEnd">${line}</div>`;
}

/* ===== 云端同步（所有设备共享同一份记录） ===== */
const SUPABASE_URL="https://ulvlphsgmyosxgqulgjz.supabase.co";
const SUPABASE_KEY="sb_publishable_GbItMxSmGeIklFxmCs8gOA_sTOx5G_-";
let deletedIds=new Set();
try{deletedIds=new Set(JSON.parse(localStorage.getItem("fox_dandelion_deleted")||"[]"))}catch(e){}
function saveDeleted(){try{localStorage.setItem("fox_dandelion_deleted",JSON.stringify([...deletedIds]))}catch(e){}}
function sbHeaders(){return {"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Accept":"application/json"}}
async function cloudFetch(){
 const r=await fetch(SUPABASE_URL+"/rest/v1/dandelion?select=*&order=ts.desc",{headers:sbHeaders()});
 if(!r.ok)throw new Error("fetch "+r.status);
 return await r.json();
}
async function cloudAdd(note){
 const r=await fetch(SUPABASE_URL+"/rest/v1/dandelion",{method:"POST",headers:Object.assign(sbHeaders(),{"Prefer":"resolution=ignore-duplicates"}),body:JSON.stringify({id:note.id,type:note.type,text:note.text,date:note.date,weather:note.weather||null,ts:note.ts,author:note.author||"me",comments:note.comments||[]})});
 if(!r.ok)throw new Error("add "+r.status);
}
async function cloudDelete(id){
 const r=await fetch(SUPABASE_URL+"/rest/v1/dandelion?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:sbHeaders()});
 if(!r.ok)throw new Error("del "+r.status);
}
async function cloudFetchOne(id){
 const r=await fetch(SUPABASE_URL+"/rest/v1/dandelion?id=eq."+encodeURIComponent(id)+"&select=*",{headers:sbHeaders()});
 if(!r.ok)throw new Error("one "+r.status);
 const j=await r.json();
 return j[0]||null;
}
async function cloudPatch(id,fields){
 const r=await fetch(SUPABASE_URL+"/rest/v1/dandelion?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:sbHeaders(),body:JSON.stringify(fields)});
 if(!r.ok)throw new Error("patch "+r.status);
}
async function syncCloud(manual){
 const cbtn=document.getElementById("cloudBtn");
 if(cbtn)cbtn.classList.add("syncing");
 try{
  const beforeLen=state.notes.length;
  const cloud=await cloudFetch().then(arr=>arr.map(normalizeNote));
  const cloudIds=new Set(cloud.map(n=>n.id));
  for(const n of cloud){if(deletedIds.has(n.id)){try{await cloudDelete(n.id)}catch(e){}}}
  const local=state.notes.map(normalizeNote).filter(n=>!cloudIds.has(n.id)&&!deletedIds.has(n.id));
  for(const n of local){try{await cloudAdd(n)}catch(e){}}
  const seen=new Set();const out=[];
  const merged=cloud.filter(n=>!deletedIds.has(n.id)).concat(local);
  for(const n of merged){
   if(!seen.has(n.id)){seen.add(n.id);out.push(n)}
   else{
    const ex=out.find(x=>x.id===n.id);
    const cm={};(ex.comments||[]).concat(n.comments||[]).forEach(c=>cm[c.ts]=c);
    ex.comments=Object.values(cm).sort((a,b)=>a.ts-b.ts);
   }
  }
  out.sort((a,b)=>(b.ts||0)-(a.ts||0));
  state.notes=out;save();render();
  for(const n of out){
   const c=cloud.find(x=>x.id===n.id);
   if(c&&JSON.stringify(c.comments||[])!==JSON.stringify(n.comments||[])){try{await cloudPatch(n.id,{comments:n.comments||[]})}catch(e){}}
  }
  if(out.length!==beforeLen||local.length>0||manual)toast(manual?"☁️ 云存档已同步":"☁️ 已同步云端，所有设备都能看到");
 }catch(e){console.log("sync failed",e)}
 if(cbtn)cbtn.classList.remove("syncing");
}
